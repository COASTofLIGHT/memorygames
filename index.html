<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --outer: #16211b;
    --board: #253a2e;
    --board-edge: #1c2e24;
    --chalk: #f2efe3;
    --chalk-dim: rgba(242,239,227,0.32);
    --chalk-accent: #e8c468;
    --wood: #5a3a24;
    --wood-dark: #402812;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at top, #1b2820 0%, var(--outer) 60%);
    font-family: 'Source Serif 4', Georgia, serif;
    padding: 32px 16px;
  }

  .frame {
    width: 100%;
    max-width: 620px;
    background: linear-gradient(180deg, var(--wood), var(--wood-dark));
    border-radius: 14px;
    padding: 14px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.06) inset,
      0 30px 60px rgba(0,0,0,0.45);
  }

  .board {
    background: radial-gradient(ellipse at 30% 0%, var(--board) 0%, var(--board-edge) 100%);
    border-radius: 8px;
    padding: 36px 34px 34px;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.35);
  }

  h1 {
    font-family: 'Kalam', cursive;
    color: var(--chalk);
    font-weight: 700;
    font-size: 1.7rem;
    margin: 0 0 4px;
    letter-spacing: 0.5px;
    text-shadow: 0 0 1px rgba(242,239,227,0.35);
  }

  .subtitle {
    font-family: 'Kalam', cursive;
    color: var(--chalk-dim);
    font-size: 0.95rem;
    margin: 0 0 22px;
  }

  .rule {
    border: none;
    border-top: 1px dashed rgba(242,239,227,0.18);
    margin: 0 0 22px;
  }

  ul.games {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  ul.games li a {
    display: block;
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 1.1rem;
    color: var(--chalk);
    text-decoration: none;
    padding: 14px 18px;
    border: 1px solid rgba(242,239,227,0.22);
    border-radius: 6px;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  ul.games li a:hover,
  ul.games li a:focus-visible {
    background-color: rgba(232,196,104,0.14);
    border-color: rgba(232,196,104,0.5);
    outline: none;
  }

  ul.games li a span.arrow {
    float: right;
    color: var(--chalk-accent);
  }

  @media (max-width: 480px) {
    .board { padding: 26px 20px 26px; }
    h1 { font-size: 1.4rem; }
    ul.games li a { font-size: 1rem; }
  }
</style>
</head>
<body>

  <div class="frame">
    <div class="board">
      <h1>Memory Games</h1>
      <p class="subtitle">Click a text to start erasing words.</p>
      <hr class="rule">
      <ul class="games">
        <li><a href="text-1-memory-game.html">Cycling — Text 1<span class="arrow">→</span></a></li>
        <li><a href="text-2-memory-game.html">Cycling — Text 2<span class="arrow">→</span></a></li>
        <li><a href="text-3-memory-game.html">Cycling — Text 3<span class="arrow">→</span></a></li>
        <li><a href="meera-memory-game.html">Meera<span class="arrow">→</span></a></li>
        <li><a href="stella-memory-game.html">Stella<span class="arrow">→</span></a></li>
        <li><a href="lenny-memory-game.html">Lenny<span class="arrow">→</span></a></li>
        <li><a href="prepare3-free-time-memory-game.html">My Free Time (Prepare 3)<span class="arrow">→</span></a></li>
      </ul>
    </div>
  </div>

</body>
</html>
